name: Sync GitHub Metrics & Rebuild Docs

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync GitHub metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync
      - name: Rebuild docs and push updated metrics
        run: |
          if [ -z "$(git status --porcelain metrics/github.json)" ]; then
            echo "No metrics updates."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TMP_METRICS=$(mktemp)
          cp metrics/github.json "$TMP_METRICS"

          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            mkdir -p metrics
            cp "$TMP_METRICS" metrics/github.json
            npm run validate && npm run build
            if [ -z "$(git status --porcelain metrics/github.json README.md README.zh.md docs/)" ]; then
              echo "No changes to commit."
              exit 0
            fi
            git add metrics/github.json README.md README.zh.md docs/
            git commit -m "chore: sync GitHub metrics and rebuild docs"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt, retrying..."
            sleep 3
          done
          echo "::error::Failed to push after 3 attempts."
          exit 1
